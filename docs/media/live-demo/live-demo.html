<!doctype html>
<!--
  README demo: prompts on the left, the running Kdenlive on the right. The four PNGs are PrintWindow captures of a
  test Kdenlive on the hidden desktop after each agent step (kdp.ps1 edits + File > Revert). Regenerate from the root:
    engine\node.cmd engine\tools\html-render.mjs docs\media\live-demo\live-demo.html <out.mp4> --sub 2
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Poppins; src: url('../../../engine/fonts/Poppins-Bold.ttf'); font-weight: 700; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f3eff9; font-family: 'Segoe UI', sans-serif; }
  #chat { position: absolute; left: 0; top: 0; bottom: 0; width: 500px; background: #1d1530; color: #fff; padding: 40px 34px; box-sizing: border-box; }
  #chat h2 { font-family: Poppins; font-size: 34px; margin: 0 0 6px; }
  #chat h2 span { color: #ff5a92; }
  #chat .sub { color: #a99cc7; font-size: 20px; margin-bottom: 30px; }
  .msg { font-size: 23px; line-height: 1.38; margin-bottom: 18px; padding: 16px 18px; border-radius: 14px; }
  .user { background: #3a2d5c; }
  .user b { color: #ff8fb6; font-weight: 600; }
  .agent { background: transparent; border: 1px solid #3b3158; color: #cfc6e6; font-family: Consolas, monospace; font-size: 18px; }
  .agent .ok { color: #6ee7a8; }
  #view { position: absolute; left: 540px; top: 90px; width: 1340px; height: 754px; border-radius: 12px; overflow: hidden; box-shadow: 0 24px 60px rgba(40, 20, 70, .28); }
  #shot { width: 1340px; display: block; transform-origin: 22% 95%; }
  #flash { position: absolute; left: 540px; top: 90px; width: 1340px; height: 754px; border-radius: 12px; background: #fff; opacity: 0; }
  #cap { position: absolute; left: 540px; top: 870px; width: 1340px; text-align: center; font-family: Poppins; font-size: 34px; color: #1d1530; }
  #cap span { color: #e8336f; }
  #end { position: absolute; inset: 0; background: #1d1530; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; }
  #end h1 { font-family: Poppins; font-size: 110px; margin: 0; }
  #end h1 span { color: #ff5a92; }
  #end p { font-size: 38px; color: #cfc6e6; margin: 18px 0 0; }
</style>
</head>
<body>
<div id="chat"><h2>Movie <span>Engine</span></h2><div class="sub">Claude Code · Codex</div><div id="msgs"></div></div>
<div id="view"><img id="shot" src="01-empty.png"></div>
<div id="flash"></div>
<div id="cap"></div>
<div id="end"><h1>Movie <span>Engine</span></h1><p>An AI agent edits your video in Kdenlive while you watch.</p><p>github.com/vladtarrow/movie-engine</p></div>
<script>
  const FPS = 30, DUR = 24
  window.SCENE = { fps: FPS, frames: FPS * DUR, width: 1920, height: 1080 }
  const shots = ['01-empty.png', '02-step1.png', '03-step2.png', '04-step3.png']
  const steps = [
    { t: 2.0, text: 'Put the three demo clips on the timeline with a cross-fade and music under them.',
      work: ['kdp bin-add ×4', 'kdp add V1 ×3, A1', 'kdp mix V1 @ 4 s'], shot: 1 },
    { t: 9.0, text: 'Add a “Movie Engine” title over the first shot.', work: ['kdp title', 'kdp add V2 @ 0.5 s'], shot: 2 },
    { t: 15.0, text: 'Mark the final card and fade the end to black.', work: ['kdp guide-add 7.9 s', 'kdp effect-add fade_to_black'], shot: 3 },
  ]
  const TYPE = 1.6, WORK = 1.6
  const imgs = shots.map(s => { const i = new Image(); i.src = s; return i })
  window.ready = Promise.all([document.fonts.ready, ...imgs.map(i => i.decode())])
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  window.render = (t) => {
    let html = '', shot = 0, flash = 0, zoom = 0
    for (const [k, s] of steps.entries()) {
      if (t < s.t) break
      const typed = Math.min(1, (t - s.t) / TYPE)
      html += `<div class="msg user"><b>You:</b> ${esc(s.text.slice(0, Math.round(s.text.length * typed)))}</div>`
      const w0 = s.t + TYPE + 0.3
      if (t >= w0) {
        const n = Math.min(s.work.length, Math.floor((t - w0) / (WORK / s.work.length)) + 1)
        let lines = s.work.slice(0, n).map(esc).join('<br>')
        const done = w0 + WORK + 0.2
        if (t >= done) {
          lines += '<br><span class="ok">Kdenlive reloaded ✓</span>'; shot = s.shot; flash = Math.max(flash, 1 - (t - done) / 0.35)
          // after the reload: show the whole window, then zoom into the timeline, then back out before the next request
          const next = k + 1 < steps.length ? steps[k + 1].t : 21.3
          const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x)
          zoom = ease((t - done - 0.9) / 0.9) - ease((t - (next - 0.9)) / 0.8)
        }
        html += `<div class="msg agent">${lines}</div>`
      }
    }
    document.getElementById('msgs').innerHTML = html
    const el = document.getElementById('shot'); if (!el.src.endsWith(shots[shot])) el.src = shots[shot]
    el.style.transform = `scale(${1 + 0.75 * Math.max(0, zoom)})`
    document.getElementById('flash').style.opacity = Math.max(0, flash) * 0.55
    document.getElementById('cap').innerHTML = t < 2 ? 'You type. The agent edits. <span>Kdenlive updates live.</span>'
      : shot ? 'The running Kdenlive, reloaded after each request' : ''
    document.getElementById('end').style.opacity = Math.min(1, Math.max(0, (t - 21.3) / 0.5))
  }
</script>
</body>
</html>
